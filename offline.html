<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>JajanDekat — Offline</title>
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#FF6B4A">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #FFF6F3;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #2A2A2A;
    padding: 24px;
  }
  .card {
    max-width: 360px;
    text-align: center;
  }
  .emoji {
    font-size: 56px;
    margin-bottom: 12px;
  }
  .brand {
    font-size: 24px;
    font-weight: 800;
    color: #2A2A2A;
    margin-bottom: 4px;
  }
  .brand span { color: #FF6B4A; }
  .tagline {
    font-size: 13px;
    color: #8a8a8a;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 17px;
    font-weight: 700;
    margin: 0 0 8px;
  }
  p {
    font-size: 13.5px;
    color: #6b6b6b;
    line-height: 1.6;
    margin: 0 0 24px;
  }
  button {
    background: #FF6B4A;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px 24px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  button:active { opacity: 0.85; }
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">📡</div>
    <div class="brand">Jajan<span>Dekat</span></div>
    <div class="tagline">Cek dulu, baru jalan.</div>
    <h1>Koneksi internet terputus</h1>
    <p>Halaman ini butuh koneksi untuk memuat data pedagang terbaru. Cek jaringan HP-mu, lalu coba lagi.</p>
    <button onclick="location.reload()">Coba Lagi</button>
  </div>
</body>
</html>
