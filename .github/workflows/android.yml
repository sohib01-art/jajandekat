name: Build Web to APK (with GPS & Camera Support)

on:
  push:
    branches: [ "main", "master" ] # Berjalan otomatis saat ada perubahan kode

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Capacitor and Plugins
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli
        npm install @capacitor/geolocation @capacitor/camera
        npx cap init "Jajan Dekat" "com.jajandekat.app" --web-dir=.
        npm install @capacitor/android
        npx cap add android

    - name: Inject Android Permissions
      run: |
        MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
        sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' $MANIFEST_PATH
        sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' $MANIFEST_PATH
        sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.CAMERA" />' $MANIFEST_PATH
        sed -i '/<\/manifest>/i \    <uses-feature android:name="android.hardware.camera" android:required="false" />' $MANIFEST_PATH

    - name: Sync Web Code to Android Project
      run: npx cap sync

    - name: Build Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Result
      uses: actions/upload-artifact@v4
      with:
        name: jajan-dekat-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
