name: Update sitemap

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch published articles
        run: |
          curl -s "https://lzcvykadtpqiqaebmmbh.supabase.co/rest/v1/articles?select=slug,updated_at&status=eq.published&order=updated_at.desc" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx6Y3Z5a2FkdHBxaXFhZWJtbWJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwOTIzODMsImV4cCI6MjEwMzY2ODM4M30.uY4lkVvdYWW7bTR1gyvoQempvbMGNyHJQRYITKsKgtQ" \
            -o articles.json

      - name: Generate sitemap.xml
        run: |
          python3 - <<'EOF'
          import json

          with open("articles.json") as f:
              articles = json.load(f)

          base = "https://jajandekat.my.id/artikel"
          urls = ["""  <url>
            <loc>{}/</loc>
            <changefreq>weekly</changefreq>
            <priority>0.8</priority>
          </url>""".format(base)]

          for a in articles:
              slug = a.get("slug", "")
              updated = (a.get("updated_at") or "")[:10]
              urls.append("""  <url>
            <loc>{}/?slug={}</loc>
            <lastmod>{}</lastmod>
            <changefreq>monthly</changefreq>
            <priority>0.7</priority>
          </url>""".format(base, slug, updated))

          xml = '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n' + "\n".join(urls) + "\n</urlset>\n"

          with open("sitemap.xml", "w") as f:
              f.write(xml)
          EOF
          rm -f articles.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git diff --staged --quiet || git commit -m "Auto-update sitemap.xml [skip ci]"
          git push
