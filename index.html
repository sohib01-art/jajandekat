<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>JajanDekat — Cari Pedagang Keliling yang Sedang Jualan di Sekitarmu</title>
<meta name="description" content="JajanDekat membantu kamu menemukan pedagang keliling (bakso, sate, gorengan, mie ayam, dll) yang sedang berjualan di sekitarmu secara real-time. Gratis, tanpa perlu akun.">
<meta name="keywords" content="pedagang keliling, bakso keliling, cari jajanan, aplikasi jajanan, pedagang kaki lima, jajan dekat, UMKM keliling">
<link rel="canonical" href="https://jajandekat.my.id/">

<!-- Open Graph (tampilan saat link dibagikan di WA/FB/dll) -->
<meta property="og:type" content="website">
<meta property="og:title" content="JajanDekat — Cek dulu, baru jalan.">
<meta property="og:description" content="Temukan pedagang keliling yang sedang berjualan di sekitarmu, real-time dan gratis.">
<meta property="og:url" content="https://jajandekat.my.id/">
<meta property="og:image" content="https://jajandekat.my.id/icon-512.png">
<meta property="og:locale" content="id_ID">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#FF6B4A">

<!-- Leaflet (peta gratis, tanpa API key) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Supabase client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="stylesheet" href="css/style.css?v=44">
</head>
<body>
<div id="app">

  <header>
    <div class="hero">
      <div class="brand-row">
        <div id="brand-tap-zone" class="brand-zone">
          <svg class="brand-logo" viewBox="0 0 48 56" aria-hidden="true">
            <path d="M24 2C11.8 2 2 11.6 2 23.4c0 15.2 17.2 28.6 20.5 31 .9.6 2.1.6 3 0C28.8 52 46 38.6 46 23.4 46 11.6 36.2 2 24 2Z" fill="#fff"/>
            <path d="M12 22h24a12 12 0 0 1-12 12 12 12 0 0 1-12-12Z" fill="#FF6B4A"/>
            <path d="M18 17c0-3 2.4-3.6 2.4-6M24 17c0-3 2.4-3.6 2.4-6M30 17c0-3 2.4-3.6 2.4-6" fill="none" stroke="#FF6B4A" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
          <div class="brand-text">
            <div class="brand">Jajan<span>Dekat</span></div>
            <div class="tagline">Cek dulu, baru jalan.</div>
          </div>
        </div>
        <button id="btn-bell" class="bell-btn" aria-label="Notifikasi" hidden>
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9Z"/><path d="M10 20a2.2 2.2 0 0 0 4 0"/>
          </svg>
          <span class="bell-dot"></span>
        </button>
      </div>
    </div>
    <div class="hero-sheet" id="mode-toggle-wrap">
      <div class="mode-toggle">
        <button id="btn-pembeli" class="active">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7Z"/></svg>
          Pembeli
        </button>
        <button id="btn-pedagang">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 9.5 5 4h14l1.5 5.5M3.5 9.5a2.8 2.8 0 0 0 5.5 0 2.8 2.8 0 0 0 6 0 2.8 2.8 0 0 0 5.5 0M5 12.5V20h14v-7.5M10 20v-4.5h4V20"/></svg>
          Pedagang
        </button>
      </div>
    </div>
  </header>

  <main id="main">
    <div class="loading">Memuat data pedagang…</div>
  </main>

  <nav class="bottom">
    <div class="nav-item active" data-view="status"><div class="nav-icon"><img src="nav_icons/status.png" alt="Status" /></div>Status</div>
    <div class="nav-item" data-view="peta"><div class="nav-icon"><img src="nav_icons/peta.png" alt="Peta" /></div>Peta</div>
    <div class="nav-item" data-view="cari"><div class="nav-icon"><img src="nav_icons/cari.png" alt="Cari" /></div>Cari</div>
    <div class="nav-item" data-view="artikel"><div class="nav-icon">📰</div>Artikel</div>
  </nav>

  <div class="toast" id="toast">
    <span class="toast-emoji">🔔</span>
    <span id="toast-text"></span>
  </div>

</div>

<script src="js/config.js?v=43"></script>
<script src="js/app.js?v=44"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => console.error('SW gagal:', err));
    });
  }
</script>
</body>
</html>
