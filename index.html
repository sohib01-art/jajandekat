<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>JajanDekat</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#FF6B4A">

<!-- Leaflet (peta gratis, tanpa API key) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Supabase client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<link rel="stylesheet" href="css/style.css?v=11">
</head>
<body>
<div id="app">

  <header>
    <div class="brand-row">
      <div>
        <div class="brand">Jajan<span>Dekat</span></div>
        <div class="tagline">Cek dulu, baru jalan.</div>
      </div>
    </div>
    <div class="mode-toggle">
      <button id="btn-pembeli" class="active">🧑 Pembeli</button>
      <button id="btn-pedagang">🛒 Pedagang</button>
    </div>
  </header>

  <main id="main">
    <div class="loading">Memuat data pedagang…</div>
  </main>

  <nav class="bottom">
    <div class="nav-item active" data-view="status"><div class="nav-icon">🟢</div>Status</div>
    <div class="nav-item" data-view="peta"><div class="nav-icon">🗺️</div>Peta</div>
    <div class="nav-item" data-view="cari"><div class="nav-icon">🔍</div>Cari</div>
  </nav>

  <div class="toast" id="toast">
    <span class="toast-emoji">🔔</span>
    <span id="toast-text"></span>
  </div>

</div>

<script src="js/config.js?v=11"></script>
<script src="js/app.js?v=11"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => console.error('SW gagal:', err));
    });
  }
</script>
</body>
</html>
