<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Koordinator Ojek – JajanDekat</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--tx:#17211c;--mu:#5d6b64;--ln:#dfe6e2;--ac:#0f7b4f;--ac2:#e6f4ed;--wn:#b45309;--wn2:#fef3e2;--er:#b3261e;--er2:#fdeceb}
@media(prefers-color-scheme:dark){:root{--bg:#121816;--card:#1a2320;--tx:#e8efeb;--mu:#93a39a;--ln:#2b3833;--ac:#4cc38a;--ac2:#173a2a;--wn:#f0b25e;--wn2:#3a2b12;--er:#f28b82;--er2:#3b1a18}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px 64px}
h1{font-size:1.25rem;margin:8px 0 4px}h2{font-size:1.05rem;margin:0 0 10px}
p{margin:0 0 10px}.mu{color:var(--mu);font-size:.875rem}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin:0 0 14px}
label{display:block;font-size:.875rem;margin:10px 0 4px;font-weight:600}
input[type=text],input[type=tel],input[type=password],input[type=url]{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
input:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin:12px 0}.chk input{margin-top:4px;width:18px;height:18px}
button{font:inherit;padding:9px 14px;border-radius:8px;border:1px solid var(--ln);background:var(--card);color:var(--tx);cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
[data-theme]{}
button.p{color:#fff}@media(prefers-color-scheme:dark){button.p{color:#0b1a12}}
button.d{color:var(--er)}button:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{display:inline-block;font-size:.8rem;padding:2px 9px;border-radius:99px;background:var(--ac2);color:var(--ac);font-weight:600}
.tag.w{background:var(--wn2);color:var(--wn)}.tag.e{background:var(--er2);color:var(--er)}
.it{border-top:1px solid var(--ln);padding:12px 0}.it:first-of-type{border-top:0}
.msg{position:fixed;left:16px;right:16px;bottom:16px;max-width:528px;margin:0 auto;padding:12px 14px;border-radius:10px;background:var(--tx);color:var(--bg);z-index:9}
.msg.e{background:var(--er);color:#fff}
ul.t{padding-left:20px;margin:0 0 10px}
</style>
</head>
<body>
<main id="app"></main>
<div id="msg" class="msg" hidden role="status"></div>
<script>
const API = 'https://lzcvykadtpqiqaebmmbh.supabase.co/functions/v1/koordinator-action';
const app = document.getElementById('app');
let cred = null, D = null, editId = null;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = iso => new Date(iso).toLocaleDateString('id-ID', {day:'numeric', month:'short', year:'numeric'});
function toast(t, err) {
  const m = document.getElementById('msg');
  m.textContent = t; m.className = 'msg' + (err ? ' e' : ''); m.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => m.hidden = true, 4500);
}
async function call(action, extra = {}) {
  const r = await fetch(API, {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({whatsapp: cred.wa, pin: cred.pin, action, ...extra})});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || 'Gagal terhubung. Coba lagi.'); e.code = j.code; e.status = r.status; throw e; }
  return j;
}
async function run(fn, okText) {
  try { const r = await fn(); if (okText) toast(okText); return r; }
  catch (e) { toast(e.message, true); return null; }
}
async function load() {
  try { D = await call('overview'); render(); }
  catch (e) { if (e.status === 401 || e.status === 429) { cred = null; sessionStorage.removeItem('kc'); } toast(e.message, true); render(); }
}

function login() {
  app.innerHTML = `<h1>Masuk koordinator</h1><p class="mu">Gunakan nomor WhatsApp dan PIN 6 digit dari admin JajanDekat.</p>
  <form class="card" id="lf">
    <label for="wa">Nomor WhatsApp</label><input id="wa" type="tel" inputmode="numeric" autocomplete="username" placeholder="081234567890" required>
    <label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password" required>
    <div class="row"><button class="p" type="submit">Masuk</button></div>
  </form>`;
  document.getElementById('lf').onsubmit = async ev => {
    ev.preventDefault();
    cred = {wa: document.getElementById('wa').value.trim(), pin: document.getElementById('pin').value.trim()};
    sessionStorage.setItem('kc', JSON.stringify(cred));
    await load();
  };
}

function terms() {
  app.innerHTML = `<h1>Ketentuan koordinator</h1><div class="card">
  <p>Sebelum mengelola grup, baca dan setujui hal berikut:</p>
  <ul class="t">
    <li>Kamu hanya mendaftarkan ojek yang sendiri setuju nama dan nomor WhatsApp-nya ditampilkan ke pembeli.</li>
    <li>Kamu mencatat cara persetujuan itu diberikan, misalnya lewat chat WhatsApp.</li>
    <li>Ojek baru tampil ke pembeli setelah diperiksa admin JajanDekat.</li>
    <li>Admin dapat menangguhkan grup atau ojek yang dilaporkan bermasalah.</li>
    <li>PIN bersifat rahasia dan tidak dibagikan ke orang lain.</li>
  </ul>
  <div class="row"><button class="p" id="ok">Saya setuju</button><button id="out">Keluar</button></div></div>`;
  document.getElementById('ok').onclick = async () => { if (await run(() => call('accept_terms'))) load(); };
  document.getElementById('out').onclick = logout;
}

function logout() { cred = null; D = null; sessionStorage.removeItem('kc'); login(); }

const gStatus = {pending:['Menunggu pemeriksaan admin','w'], verified:['Terverifikasi',''], suspended:['Ditangguhkan admin','e']};
function dStatus(d) {
  if (d.status === 'verified') return ['Tampil ke pembeli', ''];
  if (d.status === 'pending') return ['Menunggu admin', 'w'];
  return d.suspended_by === 'koordinator' ? ['Disembunyikan', 'w'] : ['Ditangguhkan admin', 'e'];
}

function render() {
  if (!cred) return login();
  if (!D) return app.innerHTML = '<p class="mu">Memuat…</p>';
  if (!D.coordinator.terms_accepted) return terms();
  const g = D.group, gs = gStatus[g.verification_status] || [g.verification_status, 'w'];
  const locked = g.verification_status === 'suspended';
  const open = D.reports.filter(r => r.status !== 'selesai');
  app.innerHTML = `
  <div class="top"><h1>Halo, ${esc(D.coordinator.name)}</h1><button id="out">Keluar</button></div>

  <section class="card"><div class="top"><h2>${esc(g.name)}</h2><span class="tag ${gs[1]}">${gs[0]}</span></div>
    ${g.verification_status === 'pending' ? '<p class="mu">Grup belum tampil ke pembeli sampai admin memeriksanya.</p>' : ''}
    ${locked ? '<p class="mu">Hubungi admin JajanDekat untuk mengaktifkan lagi.</p>' : ''}
    <form id="gf">
      <label for="gn">Nama grup</label><input id="gn" type="text" maxlength="80" value="${esc(g.name)}">
      <label for="gl">Tautan grup WhatsApp</label><input id="gl" type="url" value="${esc(g.wa_link)}">
      <p class="mu">Mengganti tautan membuat grup diperiksa ulang admin.</p>
      <label for="ga">Area layanan</label><input id="ga" type="text" maxlength="120" value="${esc(g.service_area)}" placeholder="Contoh: Sangatta Selatan dan sekitarnya">
      <label class="chk"><input id="gact" type="checkbox" ${g.active ? 'checked' : ''}>Grup aktif</label>
      <button class="p" type="submit" ${locked ? 'disabled' : ''}>Simpan grup</button>
    </form></section>

  <section class="card"><h2>Ojek di grup (${D.drivers.length}/${g.max_drivers})</h2>
    ${D.drivers.length ? D.drivers.map(d => { const s = dStatus(d); const mine = d.status !== 'suspended' || d.suspended_by === 'koordinator'; return `
    <div class="it"><div class="top"><strong>${esc(d.name)}</strong><span class="tag ${s[1]}">${s[0]}</span></div>
      <div class="mu">${esc(d.whatsapp)}${d.plate_number ? ' · ' + esc(d.plate_number) : ''}<br>Persetujuan: ${esc(d.consent_note || '-')} (${fmt(d.created_at)})</div>
      <div class="row">
        <button data-a="edit" data-id="${d.id}" ${locked ? 'disabled' : ''}>Ubah</button>
        ${d.status === 'suspended' ? `<button data-a="show" data-id="${d.id}" ${!mine || locked ? 'disabled' : ''}>Tampilkan lagi</button>` : `<button data-a="hide" data-id="${d.id}" ${locked ? 'disabled' : ''}>Sembunyikan</button>`}
        <button class="d" data-a="del" data-id="${d.id}" ${locked ? 'disabled' : ''}>Hapus</button>
      </div></div>`; }).join('') : '<p class="mu">Belum ada ojek. Tambahkan yang pertama di bawah.</p>'}
  </section>

  <section class="card"><h2>${editId ? 'Ubah ojek' : 'Tambah ojek'}</h2>
    <form id="df">
      <label for="dn">Nama ojek</label><input id="dn" type="text" maxlength="80" required>
      <label for="dw">Nomor WhatsApp ojek</label><input id="dw" type="tel" inputmode="numeric" placeholder="081234567890" required>
      <label for="dp">Plat motor (boleh kosong)</label><input id="dp" type="text" maxlength="15">
      <label class="chk"><input id="dc" type="checkbox">Ojek ini sendiri setuju nama dan nomornya tampil ke pembeli.</label>
      <label for="dnote">Catatan persetujuan</label><input id="dnote" type="text" maxlength="200" placeholder="Contoh: setuju lewat chat WA 29/9">
      <div class="row"><button class="p" type="submit" ${locked ? 'disabled' : ''}>${editId ? 'Simpan perubahan' : 'Tambah ojek'}</button>${editId ? '<button type="button" id="cx">Batal</button>' : ''}</div>
    </form></section>

  <section class="card"><h2>Laporan (${open.length} belum selesai)</h2>
    ${D.reports.length ? D.reports.map(r => `<div class="it"><div class="top"><strong>${esc(r.reason.replace('_', ' '))}</strong><span class="tag ${r.status === 'selesai' ? '' : 'w'}">${esc(r.status)}</span></div>
      <div class="mu">${fmt(r.created_at)}${r.detail ? '<br>' + esc(r.detail) : ''}</div>
      ${r.status !== 'selesai' ? `<div class="row">${r.status === 'baru' ? `<button data-a="rep" data-st="diproses" data-id="${r.id}">Sedang diproses</button>` : ''}<button data-a="rep" data-st="selesai" data-id="${r.id}">Tandai selesai</button></div>` : ''}</div>`).join('') : '<p class="mu">Belum ada laporan untuk grupmu.</p>'}
  </section>

  <section class="card"><h2>Ganti PIN</h2>
    <form id="pf"><label for="np">PIN baru (6 digit)</label><input id="np" type="password" inputmode="numeric" maxlength="6" required>
    <div class="row"><button type="submit">Ganti PIN</button></div></form></section>`;

  document.getElementById('out').onclick = logout;
  document.getElementById('gf').onsubmit = async ev => {
    ev.preventDefault();
    const r = await run(() => call('update_group', {group: {name: gn.value, wa_link: gl.value, service_area: ga.value, active: gact.checked}}));
    if (r) { toast(r.needs_reverify ? 'Tersimpan. Tautan baru akan diperiksa ulang admin.' : 'Grup tersimpan.'); load(); }
  };
  const df = document.getElementById('df');
  if (editId) { const d = D.drivers.find(x => x.id === editId); if (d) { dn.value = d.name; dw.value = d.whatsapp; dp.value = d.plate_number || ''; } }
  df.onsubmit = async ev => {
    ev.preventDefault();
    const driver = {name: dn.value, whatsapp: dw.value, plate_number: dp.value, consent_confirmed: dc.checked, consent_note: dnote.value};
    if (editId) { driver.id = editId; const cur = D.drivers.find(x => x.id === editId); if (cur && dw.value.replace(/\D/g, '').replace(/^0/, '62') === cur.whatsapp) { delete driver.consent_confirmed; delete driver.consent_note; } }
    if (await run(() => call('save_driver', {driver}), editId ? 'Perubahan tersimpan.' : 'Ojek ditambahkan. Menunggu pemeriksaan admin.')) { editId = null; load(); }
  };
  const cx = document.getElementById('cx'); if (cx) cx.onclick = () => { editId = null; render(); };
  document.getElementById('pf').onsubmit = async ev => {
    ev.preventDefault();
    const np = document.getElementById('np').value.trim();
    if (await run(() => call('change_pin', {new_pin: np}), 'PIN diganti.')) { cred.pin = np; sessionStorage.setItem('kc', JSON.stringify(cred)); ev.target.reset(); }
  };
  app.onclick = async ev => {
    const b = ev.target.closest('button[data-a]'); if (!b) return;
    const id = b.dataset.id, a = b.dataset.a;
    if (a === 'edit') { editId = id; render(); document.getElementById('df').scrollIntoView({behavior: 'smooth'}); }
    else if (a === 'hide' || a === 'show') { if (await run(() => call('set_driver_hidden', {ojek_id: id, hidden: a === 'hide'}), a === 'hide' ? 'Ojek disembunyikan.' : 'Ojek ditampilkan lagi.')) load(); }
    else if (a === 'del') { if (confirm('Hapus ojek ini dari grup? Tindakan ini tidak bisa dibatalkan.') && await run(() => call('delete_driver', {ojek_id: id}), 'Ojek dihapus.')) load(); }
    else if (a === 'rep') { if (await run(() => call('update_report_status', {report_id: id, status: b.dataset.st}), 'Status laporan diperbarui.')) load(); }
  };
}

try { cred = JSON.parse(sessionStorage.getItem('kc') || 'null'); } catch (_) { cred = null; }
cred ? load() : login();
</script>
</body>
</html>
