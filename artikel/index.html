<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Artikel — JajanDekat</title>
<meta name="description" content="Cerita jajanan legendaris dari berbagai kota, tips jualan, dan panduan pakai JajanDekat." />
<meta name="theme-color" content="#FF6B4A" />

<style>
  :root{
    --orange: #FF6B4A;
    --orange-dark: #E0532F;
    --cream: #F8F4EC;
    --ink: #2B2420;
    --ink-soft: #6B6058;
    --border: #EAE2D6;
    --card: #FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    line-height:1.5;
  }
  header.top{
    background:var(--orange);
    color:#fff;
    padding:20px 20px 28px;
  }
  header.top .brand{
    font-size:22px;
    font-weight:800;
    letter-spacing:-0.02em;
  }
  header.top .brand span{ opacity:.85; font-weight:600; }
  header.top .tagline{
    font-size:13px;
    opacity:.85;
    margin-top:2px;
  }
  header.top .page-title{
    margin-top:18px;
    font-size:15px;
    font-weight:700;
    opacity:.95;
  }
  main{
    max-width:640px;
    margin:0 auto;
    padding:18px 16px 60px;
  }

  .filter-row{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:6px;
    margin-bottom:18px;
  }
  .filter-chip{
    flex:none;
    padding:7px 14px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--card);
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    cursor:pointer;
    white-space:nowrap;
  }
  .filter-chip.active{
    background:var(--orange);
    border-color:var(--orange);
    color:#fff;
  }
  .article-card{
    display:flex;
    gap:12px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px;
    margin-bottom:12px;
    text-decoration:none;
    color:inherit;
  }
  .article-card img{
    width:88px;
    height:88px;
    border-radius:10px;
    object-fit:cover;
    background:var(--border);
    flex:none;
  }
  .article-card .meta{
    font-size:11px;
    font-weight:700;
    color:var(--orange-dark);
    text-transform:uppercase;
    letter-spacing:.02em;
  }
  .article-card h3{
    margin:4px 0 4px;
    font-size:15px;
    line-height:1.3;
  }
  .article-card p{
    margin:0;
    font-size:13px;
    color:var(--ink-soft);
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .empty, .loading{
    text-align:center;
    color:var(--ink-soft);
    padding:40px 10px;
    font-size:14px;
  }

  .back-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    font-weight:700;
    color:#fff;
    text-decoration:none;
    opacity:.9;
  }
  .detail-cover{
    width:100%;
    aspect-ratio:4/3;
    object-fit:cover;
    border-radius:14px;
    background:var(--border);
    margin-bottom:18px;
  }
  .detail-meta{
    font-size:11px;
    font-weight:700;
    color:var(--orange-dark);
    text-transform:uppercase;
    letter-spacing:.02em;
    margin-bottom:6px;
  }
  .detail-title{
    font-size:24px;
    font-weight:800;
    line-height:1.25;
    margin:0 0 16px;
  }
  .detail-body{
    font-size:15.5px;
    color:var(--ink);
  }
  .detail-body p{ margin:0 0 14px; }
  .detail-body h3, .detail-body h4{
    margin:22px 0 10px;
    font-weight:800;
    line-height:1.3;
  }
  .detail-body h3{ font-size:19px; }
  .detail-body h4{ font-size:16.5px; }
  .detail-body strong{ font-weight:700; }
  .detail-body ul{ margin:0 0 14px; padding-left:20px; }
  .detail-body li{ margin-bottom:6px; }
  footer.site{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    padding:30px 16px 50px;
  }
</style>
</head>
<body>

<header class="top">
  <div id="headerInner">
    <div class="brand">Jajan<span>Dekat</span></div>
    <div class="tagline">Cek dulu, baru jalan.</div>
    <div class="page-title">Artikel &amp; Cerita Jajanan</div>
  </div>
</header>

<main id="app">
  <div class="loading">Memuat artikel…</div>
</main>

<footer class="site">© JajanDekat — jajandekat.my.id</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://lzcvykadtpqiqaebmmbh.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx6Y3Z5a2FkdHBxaXFhZWJtbWJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwOTIzODMsImV4cCI6MjEwMzY2ODM4M30.uY4lkVvdYWW7bTR1gyvoQempvbMGNyHJQRYITKsKgtQ";

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const app = document.getElementById("app");
  const headerInner = document.getElementById("headerInner");

  function getSlugFromUrl() {
    const params = new URLSearchParams(window.location.search);
    return params.get("slug");
  }

  function formatDate(dateStr) {
    if (!dateStr) return "";
    const d = new Date(dateStr);
    return d.toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric" });
  }

  async function renderList() {
    headerInner.innerHTML = `
      <div class="brand">Jajan<span>Dekat</span></div>
      <div class="tagline">Cek dulu, baru jalan.</div>
      <div class="page-title">Artikel &amp; Cerita Jajanan</div>
    `;

    const { data: articles, error } = await sb
      .from("articles")
      .select("id, title, slug, meta_description, cover_image, category, created_at")
      .order("created_at", { ascending: false });

    if (error) {
      app.innerHTML = `<div class="empty">Gagal memuat artikel. Coba refresh halaman.</div>`;
      console.error(error);
      return;
    }
    if (!articles || articles.length === 0) {
      app.innerHTML = `<div class="empty">Belum ada artikel.</div>`;
      return;
    }

    const categories = ["Semua", ...new Set(articles.map(a => a.category).filter(Boolean))];

    function draw(activeCategory) {
      const filtered = activeCategory === "Semua"
        ? articles
        : articles.filter(a => a.category === activeCategory);

      const chips = categories.map(c => `
        <button class="filter-chip ${c === activeCategory ? "active" : ""}" data-cat="${c}">${c}</button>
      `).join("");

      const cards = filtered.map(a => `
        <a class="article-card" href="?slug=${encodeURIComponent(a.slug)}">
          <img src="${a.cover_image || ""}" alt="" loading="lazy" onerror="this.style.opacity=0" />
          <div>
            <div class="meta">${a.category || "Artikel"} · ${formatDate(a.created_at)}</div>
            <h3>${a.title}</h3>
            <p>${a.meta_description || ""}</p>
          </div>
        </a>
      `).join("");

      app.innerHTML = `
        <div class="filter-row">${chips}</div>
        ${cards || `<div class="empty">Belum ada artikel di kategori ini.</div>`}
      `;

      app.querySelectorAll(".filter-chip").forEach(btn => {
        btn.addEventListener("click", () => draw(btn.dataset.cat));
      });
    }

    draw("Semua");
  }

  function escapeHtml(str) {
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function inlineMd(str) {
    let s = escapeHtml(str);
    s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, "<em>$1</em>");
    return s;
  }

  function markdownToHtml(md) {
    const blocks = (md || "").split(/\n\n+/);
    let html = "";
    let listBuffer = [];

    function flushList() {
      if (listBuffer.length) {
        html += "<ul>" + listBuffer.map(li => `<li>${inlineMd(li)}</li>`).join("") + "</ul>";
        listBuffer = [];
      }
    }

    blocks.forEach(block => {
      const lines = block.split("\n").map(l => l.trim()).filter(Boolean);
      const isList = lines.length > 0 && lines.every(l => /^[-*]\s+/.test(l));

      if (isList) {
        lines.forEach(l => listBuffer.push(l.replace(/^[-*]\s+/, "")));
        return;
      }
      flushList();

      const headingMatch = block.match(/^(#{1,3})\s+(.*)$/);
      if (headingMatch) {
        const level = headingMatch[1].length + 2;
        html += `<h${level}>${inlineMd(headingMatch[2])}</h${level}>`;
        return;
      }

      html += `<p>${inlineMd(block).replace(/\n/g, "<br>")}</p>`;
    });

    flushList();
    return html;
  }

  async function renderDetail(slug) {
    headerInner.innerHTML = `
      <a class="back-link" href="./">← Semua artikel</a>
      <div class="brand" style="margin-top:10px;">Jajan<span>Dekat</span></div>
    `;

    app.innerHTML = `<div class="loading">Memuat artikel…</div>`;

    const { data: article, error } = await sb
      .from("articles")
      .select("title, content, cover_image, category, created_at")
      .eq("slug", slug)
      .single();

    if (error || !article) {
      app.innerHTML = `<div class="empty">Artikel tidak ditemukan. <a href="./">Kembali ke daftar artikel</a></div>`;
      return;
    }

    document.title = article.title + " — JajanDekat";

    const bodyHtml = markdownToHtml(article.content);

    app.innerHTML = `
      ${article.cover_image ? `<img class="detail-cover" src="${article.cover_image}" alt="" />` : ""}
      <div class="detail-meta">${article.category || "Artikel"} · ${formatDate(article.created_at)}</div>
      <h1 class="detail-title">${article.title}</h1>
      <div class="detail-body">${bodyHtml}</div>
    `;
  }

  const slug = getSlugFromUrl();
  if (slug) {
    renderDetail(slug);
  } else {
    renderList();
  }
</script>
</body>
</html>
