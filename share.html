  <script>
    // Tangkap konten yang di-share dari app lain (WhatsApp, browser, dll.)
    // dan cari kode follow (?follow=KODE) kalau ada di dalamnya, lalu redirect.
    const params = new URLSearchParams(location.search);
    const sharedUrl = params.get('url') || '';
    const sharedText = params.get('text') || '';
    const combined = sharedUrl + ' ' + sharedText;

    const match = combined.match(/[?&]follow=([A-Za-z0-9_-]+)/);

    if (match && match[1]) {
      location.replace('./?follow=' + encodeURIComponent(match[1]));
    } else {
      location.replace('./');
    }
  </script>
